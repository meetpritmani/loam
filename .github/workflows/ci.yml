name: CI

on:
  push:
  pull_request:

# Least privilege. The job below needs nothing but the checkout.
#
# The previous workflow used shopify/theme-check-action, which reports its
# findings through the Checks API and therefore needs `checks: write`. The
# default GITHUB_TOKEN is read-only, so every run failed with "Resource not
# accessible by integration" before it had reported anything — the theme was
# never actually the problem. Running the CLI directly removes the dependency
# on token scopes entirely: the check is static and offline, so the build
# result cannot be changed by a repository permission setting.
permissions:
  contents: read

jobs:
  theme-check:
    name: Theme Check
    runs-on: ubuntu-latest

    env:
      # Keep the CLI non-interactive and quiet in CI.
      CI: "true"
      SHOPIFY_CLI_NO_ANALYTICS: "1"

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Shopify CLI
        run: npm install --global @shopify/cli

      # Uses the repo's .theme-check.yml (theme-check:recommended), so CI
      # validates exactly what `shopify theme check` validates locally.
      # --fail-level error means warnings are reported but do not fail the
      # build; OrphanedSnippet in particular is expected while a phase is in
      # progress and a snippet's section has not been written yet.
      - name: Theme Check
        run: shopify theme check --fail-level error

  seed-scripts:
    name: Seed scripts
    runs-on: ubuntu-latest

    # The §12 tooling is not part of the theme, so theme-check ignores it. It
    # still gets checked: these scripts write to a real store, and a syntax
    # error in one is only discovered at the moment it matters least.
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # No install. `node --check` parses .mjs as an ES module, including
      # top-level await, and needs nothing from node_modules. sharp is a native
      # module whose download would be the slowest step in this workflow by an
      # order of magnitude, for no benefit here.
      - name: Parse every script
        run: |
          for file in scripts/*.mjs scripts/lib/*.mjs; do
            node --check "$file"
            echo "ok  $file"
          done

      # scripts/check-secrets.mjs guards the commit, by scanning the staged
      # index. There is no index in CI, so this scans the checked-out tree
      # instead — the backstop for a token that reached the branch some other
      # way, with the hook not installed.
      - name: No credentials in the tree
        run: |
          if git grep -nE 'shpat_[a-fA-F0-9]{32}|shpss_[a-fA-F0-9]{32}|shpca_[a-fA-F0-9]{32}' -- . ':(exclude).github'; then
            echo "::error::A Shopify API token is present in the repository."
            exit 1
          fi
          echo "No credentials found."

  spec-checks:
    name: Spec checks
    runs-on: ubuntu-latest

    # Three audits of things theme-check has no opinion about, because they
    # come from CLAUDE.md rather than from Shopify: WCAG contrast across every
    # colour scheme in every shipped theme style (§8), the §14 per-section
    # checklist, and drift between the translated locales and English (§3).
    #
    # All three are pure Node reading files in the repo. No install step, so
    # they add seconds rather than minutes.
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Colour contrast
        run: node scripts/check-contrast.mjs

      - name: Section checklist
        run: node scripts/check-sections.mjs

      - name: Locale drift
        run: node scripts/check-locales.mjs
